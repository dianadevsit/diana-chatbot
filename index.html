<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DianaBot - Your Friendly Chat Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <img src="bot.webp" alt="DianaBot Avatar" class="bot-avatar" />
      <h1>DianaBot</h1>
      <p>Your friendly portfolio assistant</p>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="bot-message">Hi there! 👋 I'm DianaBot. Ask me anything!</div>
    </div>

    <form id="chatForm" class="chat-input-area">
      <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
